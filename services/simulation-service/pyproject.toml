[project]
name = "simulation-service"
version = "1.0.0"
description = "Microservicio stateless: simula circuitos de corriente continua por MNA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
