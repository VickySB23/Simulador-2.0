name: Tests y GitHub Pages

on:
  push:
    branches: [web]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Una publicación a la vez; no se cancela una que ya empezó.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Correr tests (sin dependencias)
        run: node --test

  publicar:
    name: Publicar frontend/public
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Versión del service worker desde el commit
        # En el repo dice simulador-dc-dev; lo publicado lleva el hash, así cada publicación
        # instala un service worker nuevo y muestra "Hay una versión nueva — Actualizar".
        run: |
          VERSION="simulador-dc-${GITHUB_SHA::7}"
          sed -i "s/\"simulador-dc-dev\"/\"$VERSION\"/" frontend/public/sw.js frontend/public/js/version.js
          grep -q "const VERSION = \"$VERSION\"" frontend/public/sw.js
          grep -q "export const VERSION = \"$VERSION\"" frontend/public/js/version.js
          echo "Versión publicada: $VERSION"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/public
      - id: publicacion
        uses: actions/deploy-pages@v5
