name: Tests y GitHub Pages

on:
  push:
    branches: [web]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Una publicación a la vez; no se cancela una que ya empezó.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correr tests (sin dependencias)
        run: node --test

  publicar:
    name: Publicar frontend/public
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public
      - id: publicacion
        uses: actions/deploy-pages@v4
