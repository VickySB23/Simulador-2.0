name: CI

on:
  push:
    branches: [main, microservicios]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [simulation-service, circuit-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    # Los tests del repositorio de circuit-service necesitan un MongoDB real.
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_TEST_URI: mongodb://localhost:27017
      # Si Mongo no está, los tests de integración fallan en vez de saltearse.
      MONGO_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        # --locked falla si uv.lock no coincide con pyproject.toml.
        run: uv sync --locked
      - name: Correr tests
        run: uv run pytest -q -rs

  docker:
    name: Build de imágenes y compose
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: docker compose -f docker-compose.yml config -q
      - name: Construir todos los servicios
        run: docker compose -f docker-compose.yml build
