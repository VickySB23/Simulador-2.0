# Headers comunes. Se incluye en el server y en cada location que agrega headers propios:
# en nginx, un add_header dentro de una location anula los heredados del server.
add_header Cache-Control "no-cache" always;
# La CSP solo permite recursos propios: no hay CDN ni scripts en línea.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
