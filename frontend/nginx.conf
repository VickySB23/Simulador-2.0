# Editor web estático. Traefik le manda todo lo que no es /simulate, /api/circuits ni /health.
# Corre como usuario sin privilegios (nginx-unprivileged), por eso escucha en 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # Sin paso de build los nombres de archivo no cambian: el navegador revalida siempre.
    include /etc/nginx/snippets/seguridad.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Si un backend no está registrado en Traefik (arrancando o caído), su ruta de Consul no
    # existe y el pedido cae en la ruta de prioridad baja del frontend. Responder 503 con
    # Retry-After mantiene el contrato de la API: nunca un 404 ni el index.html.
    location ^~ /api/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Retry-After 2 always;
        default_type application/json;
        return 503 '{"code":"unavailable","message":"El servicio no está disponible en este momento. Reintentá en unos segundos.","details":{}}';
    }

    location = /simulate {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Retry-After 2 always;
        default_type application/json;
        return 503 '{"code":"unavailable","message":"El simulador no está disponible en este momento. Reintentá en unos segundos.","details":{}}';
    }

    location = /health {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Retry-After 2 always;
        default_type application/json;
        return 503 '{"status":"unhealthy","code":"unavailable"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
